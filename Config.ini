! 高阶隐式：O13/S2 真实面通量与体碰撞 + R6 低阶近似修正。
! 三个正式入口使用同一 Ma3 物理配置、网格、速度表和壁面。
! 质量比例校正仅封闭 Couette 隐式启用；显式和开放边界不得启用。
&config_para
!===============================================================================
! 1. 初态与气体模型：保留已短测的 Ma3 Couette 参数，不使用平板参数
!===============================================================================
Iflag_InitFlow = 0              ! 0=冷启动；2=读取本程序 flow2d.dat 与 vdf2d.dat 续算
Ma = 0.0d0                     ! 初始气体静止；壁面 Ma3 由下方 WallUx 指定
Re = 1.0d0                     ! 本算例实际黏度由 CouetteMuRef 覆盖
AOA = 0.0d0
Tinf = 2.0d0                   ! 原生温标：p=rho*T/2；初态 theta=T/2=1
Tw = 2.0d0                     ! 两侧等温壁，theta_w=1
ck = 1                         ! 此算例 gamma=5/3；不要换成附件的 ck=3
Pr = 0.66666666666666666667d0    ! 保留本工况 Pr=2/3
flag_vislaw = 1                ! 1=幂律黏度；不要改为附件的 Sutherland
omega = 0.5d0
Tcm = 0.4044d0                 ! 当前幂律模式不使用 Sutherland 参数
CouetteMuRef = 0.05637282460904075d0
StructuredVelocityFile = 'velocity_half32_scale2.dat'

!===============================================================================
! 2. 方法选择与步长：物理全局 CFL；隐式另用伪时间
!===============================================================================
TimeIntegration_method = 'HighOrderImplicit'
UnifiedPhysicalOperators = .true.
S2PhysicalGas=1
S2_mu_ref=0.05637282460904075d0
S2W1_wall_mode=1
S2VelocityTable='half32'
S2VelocityScale=2.0d0
S2CartesianMesh=.true.
S2Diagnostics=.false.
TimeStep_method = 1            ! 1=全局 CFL 物理通量步长，沿用已测设置
CFL = 0.1d0                   ! UGKS 面通量的物理 CFL
Implicit_nCFL = 1000.0d0       ! 原隐式修正方向；伪时间 CFL
Implicit_ZhuMovingWall = .true.
Implicit_InitHaloResync = .true.
ClosedCouetteMassRescale = .true.
Implicit_MacroSweeps = 2
Implicit_MicroSweeps = 1
Implicit_ResidualTol = 1.0d-8
Implicit_MomentTol = 1.0d-12
Implicit_MinAlpha = 1.0d-6
Implicit_MaxRetries = 0
Implicit_MaxIter = 3000 
Implicit_ClosedMassConstraint = .false. ! 关闭新增全局密度修正及微观四矩投影，恢复原隐式方向

!===============================================================================
! 3. 停止与输出：长计算上限；达到上限不等于达到稳态
!===============================================================================
dt_global = 0.00025d0          ! 启动占位；运行由全局 CFL 计算物理 dt
MAX_ITER = 3000 
EPS = 1.0d-12                  ! 显式残差参数；不是当前定常隐式的停止门
Nstep_show = 100 
Nstep_write = 100 
Nstep_restart = 100  ! 最新完整续算，覆盖保存；0=仅结束保存
Nstep_audit = 0      ! 历史state/restart/profile快照；0=关闭
Nstep_monitor = 1    ! 真实接受态标量残差CSV写出间隔，不改变每步判定
Iflag_WriteSurf = 1
Iflag_WriteRestart = 1

!===============================================================================
! 4. 物理网格、离散速度与 MPI：总核数 NP_X*NP_Y=8
!===============================================================================
Nx_all = 8
Ny_all = 64
NP_X = 1
NP_Y = 8
Quadrature_method = 2          ! 使用下述外部结构化速度表；不是重新生成默认GH表
Nu = 32
Nv = 32
U_MIN = -16.051374658065264d0
U_MAX =  16.051374658065264d0
V_MIN = -16.051374658065264d0
V_MAX =  16.051374658065264d0
/

&boundary_para
!===============================================================================
! 5. 左右周期、上下移动等温漫反射壁面
!===============================================================================
BC_Type = 10 10 2 2            ! 顺序：左、右、下、上；10=周期，2=等温壁
BG_geometry = 0               ! 通用矩形域，不启用平板特例
FluxWall_type = 1
ACC = 1.0d0
CouetteUseW2BWall = .true.     ! 复用已接入的 W2B 壁面修复
WallUx = 0.0d0 0.0d0 -3.872983346207417d0 3.872983346207417d0
/

!===============================================================================
! 6. 扰动关闭：下面三行必须依次为 Iflag_DIS、Iflag_Fringe、DISBC_Type
!===============================================================================
$DIS_para
0                             ! 无外加扰动
0                             ! 无 fringe 强迫
0                             ! 无边界扰动
$DIS_para
